<article class="article col col-4 col-d-6 col-t-12">
  {{ with .Params.Image }}<a class="article__image" href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true"><img src="{{ . | absURL }}" alt="" width="640" height="360" loading="lazy" decoding="async"></a>{{ end }}
  <div class="article__body"><div class="article__meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time><span>{{ .ReadingTime }} min di lettura</span></div>
  <div class="article-tags__box">{{ range first 2 (.GetTerms "tags") }}<a class="badge" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div>
  <h2 class="article__title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p class="article__excerpt">{{ if .Description }}{{ .Description }}{{ else }}{{ .Summary | plainify | truncate 170 }}{{ end }}</p><a class="article__read" href="{{ .RelPermalink }}" aria-label="Leggi: {{ .Title }}">Leggi l’articolo <span aria-hidden="true">↗</span></a></div>
</article>
