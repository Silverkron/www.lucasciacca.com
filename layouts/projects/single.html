{{ define "main" }}

    <div class="container">

        <div class="page-head">
            <h1 class="page-title">{{ .Title }}</h1>
            {{ if .Params.subtitle }}
                <p class="project-subtitle">{{ .Params.subtitle }}</p>
            {{ end }}
        </div>

        {{ if .Params.image }}
            <div class="row">
                <div class="col col-12">
                    <div class="page-image">
                        <img loading="lazy" decoding="async" src="{{ .Params.Image | absURL }}" alt="{{ .Title }}">
                    </div>
                </div>
            </div>
        {{ end }}

        <div class="project-content">
            {{ .Content }}
        </div>

        {{ if .PrevInSection }}
            <div class="project__nav">
                <a class="project__prev" href="{{ .PrevInSection.Permalink }}">
                    <div class="project__box">
                        <span class="project__nav-info">Progetto successivo →</span>
                        <h2 class="project__nav-title">{{ .PrevInSection.Title }}</h2>
                    </div>
                </a>
                <a class="project__nav-image" href="{{ .PrevInSection.Permalink }}">
                    <img loading="lazy" decoding="async" src="{{ .PrevInSection.Params.Image }}" alt="{{ .PrevInSection.Title }}">
                </a>
            </div>
        {{ end }}

    </div>

{{ end }}
